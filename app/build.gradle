plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'ir.tripanalyzer.app'
    compileSdk 34
    defaultConfig {
        applicationId "ir.tripanalyzer.app"
        minSdk 26
        targetSdk 34
        versionCode 152
        versionName "3.2.7"
    }
    def ksPath = System.getenv("RAIDO_KEYSTORE_PATH")
    def hasReleaseKey = ksPath != null && file(ksPath).exists()
    signingConfigs {
        // امضای ثابت برای بیلدهای بدون کلید انتشار: هر بیلد جدید روی قبلی نصب (آپدیت) می‌شود.
        // کلید عمومی/آزمایشی است؛ برای انتشار در بازار حتماً کلید اصلی (RAIDO_KEYSTORE_*) استفاده شود.
        ci {
            storeFile file("raido-ci.keystore")
            storePassword "raidoci123"
            keyAlias "raidoci"
            keyPassword "raidoci123"
        }
        if (hasReleaseKey) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("RAIDO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RAIDO_KEY_ALIAS") ?: "raido"
                keyPassword System.getenv("RAIDO_KEY_PASSWORD") ?: System.getenv("RAIDO_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
            else signingConfig signingConfigs.ci
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}
