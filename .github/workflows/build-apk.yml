name: Build RAIDO APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # لازم برای ساخت Release روی تگ

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (اختیاری)
        env:
          KEYSTORE_B64: ${{ secrets.RAIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raido-release.keystore"
            echo "RAIDO_KEYSTORE_PATH=$RUNNER_TEMP/raido-release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; APK will be signed with debug key."
          fi

      - name: Build release APK
        env:
          RAIDO_KEYSTORE_PASSWORD: ${{ secrets.RAIDO_KEYSTORE_PASSWORD }}
          RAIDO_KEY_ALIAS: ${{ secrets.RAIDO_KEY_ALIAS }}
          RAIDO_KEY_PASSWORD: ${{ secrets.RAIDO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/RAIDO-v${VER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (روی تگ v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
