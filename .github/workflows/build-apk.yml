name: Build RAIDO APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure MainActivity is full (restore if shell/placeholder)
        run: |
          set -e
          F=app/src/main/java/ir/tripanalyzer/app/MainActivity.java
          BYTES=$(wc -c < "$F")
          echo "MainActivity bytes=$BYTES"
          if [ "$BYTES" -lt 10000 ] || grep -qE 'PLACEHOLDER|نسخه UI در حال' "$F"; then
            echo "Restoring MainActivity from good commit 9ce568d..."
            git show 9ce568d283dd94612839ed65ad63554e3ad624d7:"$F" > "$F"
            python3 -c "
from pathlib import Path
p = Path('app/src/main/java/ir/tripanalyzer/app/MainActivity.java')
c = p.read_text(encoding='utf-8')
assert 'class MainActivity' in c and 'PLACEHOLDER' not in c
c = c.replace('ic.setTextColor(selected ? 0xFF0F172A : 0xFF64748B);', 'ic.setTextColor(selected ? UiKit.BRAND : 0xFF82908B);')
c = c.replace('lb.setTextColor(selected ? 0xFF0F172A : 0xFF64748B);', 'lb.setTextColor(selected ? UiKit.BRAND : 0xFF82908B);')
c = c.replace('pill.setColor(0xFFF1F5F9);', 'pill.setColor(0xFFE5F4EB);')
p.write_text(c, encoding='utf-8')
print('restored', len(c), 'BRAND', c.count('UiKit.BRAND'))
"
          else
            echo "MainActivity looks full; leave as-is"
          fi
          wc -c "$F"
          grep -n 'class MainActivity\|UiKit.BRAND\|buildBottomNav' "$F" | head -10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RAIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raido-release.keystore"
            echo "RAIDO_KEYSTORE_PATH=$RUNNER_TEMP/raido-release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; APK will be signed with debug key."
          fi

      - name: Build release APK (R8 on)
        env:
          RAIDO_KEYSTORE_PASSWORD: ${{ secrets.RAIDO_KEYSTORE_PASSWORD }}
          RAIDO_KEY_ALIAS: ${{ secrets.RAIDO_KEY_ALIAS }}
          RAIDO_KEY_PASSWORD: ${{ secrets.RAIDO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          if grep -q "minifyEnabled true" app/build.gradle; then
            echo "R8/minifyEnabled=true in build.gradle"
          fi
          ls -la app/build/outputs/mapping/release/ 2>/dev/null || echo "No mapping dir"

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/RAIDO-v${VER}.apk"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/RAIDO-v${VER}-mapping.txt"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
