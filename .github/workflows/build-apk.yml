name: Build RAIDO APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RAIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raido-release.keystore"
            echo "RAIDO_KEYSTORE_PATH=$RUNNER_TEMP/raido-release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; APK will be signed with debug key."
          fi

      - name: Build release APK (R8 on)
        env:
          RAIDO_KEYSTORE_PASSWORD: ${{ secrets.RAIDO_KEYSTORE_PASSWORD }}
          RAIDO_KEY_ALIAS: ${{ secrets.RAIDO_KEY_ALIAS }}
          RAIDO_KEY_PASSWORD: ${{ secrets.RAIDO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          if grep -q "minifyEnabled true" app/build.gradle; then
            echo "R8/minifyEnabled=true in build.gradle"
          fi
          ls -la app/build/outputs/mapping/release/ 2>/dev/null || echo "No mapping dir"

      - name: Verify APK signature and manifest
        run: |
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -12
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk" 

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/RAIDO-v${VER}.apk"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/RAIDO-v${VER}-mapping.txt"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
