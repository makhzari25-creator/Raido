name: Restore MainActivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/restore-mainactivity'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/target-v1
          fetch-depth: 0

      - name: Restore MainActivity from good commit and apply teal nav
        run: |
          set -e
          GOOD=9ce568d283dd94612839ed65ad63554e3ad624d7
          git show "$GOOD:app/src/main/java/ir/tripanalyzer/app/MainActivity.java" > app/src/main/java/ir/tripanalyzer/app/MainActivity.java
          python3 << 'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ir/tripanalyzer/app/MainActivity.java')
          c = p.read_text(encoding='utf-8')
          assert 'class MainActivity' in c
          assert 'PLACEHOLDER' not in c
          c = c.replace(
              'ic.setTextColor(selected ? 0xFF0F172A : 0xFF64748B);',
              'ic.setTextColor(selected ? UiKit.BRAND : 0xFF82908B);'
          ).replace(
              'lb.setTextColor(selected ? 0xFF0F172A : 0xFF64748B);',
              'lb.setTextColor(selected ? UiKit.BRAND : 0xFF82908B);'
          ).replace(
              'pill.setColor(0xFFF1F5F9);',
              'pill.setColor(0xFFE5F4EB);'
          ).replace(
              '''        nav.addView(navItem("⌂", "خانه", true, null));
        nav.addView(navItem("➤", "جزئیات", false, DetailsActivity.class));
        nav.addView(navItem("▦", "آمار", false, ReportsActivity.class));
        nav.addView(navItem("☰", "منو", false, null));''',
              '''        nav.addView(navItem("⌂", "خانه", true, null));
        nav.addView(navItem("▥", "گزارش", false, ReportsActivity.class));
        nav.addView(navItem("⌁", "تحلیل", false, DetailsActivity.class));
        nav.addView(navItem("⚙", "تنظیمات", false, SettingsActivity.class));'''
          )
          p.write_text(c, encoding='utf-8')
          print('restored bytes', len(c))
          print('UiKit.BRAND count', c.count('UiKit.BRAND'))
          PY
          git config user.name "raido-ci"
          git config user.email "ci@raido.local"
          git add app/src/main/java/ir/tripanalyzer/app/MainActivity.java
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "fix: MainActivity full restore + teal bottom nav"
            git push origin HEAD:ui/target-v1
          fi
