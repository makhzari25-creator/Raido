<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل رایدو</title>
<style>
  :root{--bg:#f0fdfa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0f766e;--brand2:#14b8a6;--warn:#b45309;--bad:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e6edf7;--muted:#94a3b8;--line:#22304a;--brand:#2dd4bf;--brand2:#14b8a6}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,Tahoma,sans-serif}
  header{background:linear-gradient(135deg,#0b3d3a,#0f766e);color:#fff;padding:18px 16px}
  header h1{margin:0;font-size:20px} header p{margin:2px 0 0;opacity:.8;font-size:13px}
  main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
  input[dir=ltr]{text-align:left}
  button{padding:11px 16px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
  button:disabled{opacity:.5} .row{display:flex;gap:8px} .row>*{flex:1}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--brand)} .stat span{font-size:12px;color:var(--muted)}
  .code{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-top:8px;font-family:ui-monospace,monospace;direction:ltr}
  .code button{padding:6px 12px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
  th{color:var(--muted);font-weight:600} .tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--line);font-size:12px}
  .tag.p{background:#ccfbf1;color:#0f766e} .msg{font-size:13px;margin-top:8px;min-height:1.2em} .err{color:var(--bad)} .ok{color:var(--brand)}
  .scroll{overflow-x:auto}
  .hint{font-size:12px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<header><h1>پنل مدیریت رایدو</h1><p>ساخت کد، آمار کاربران، مدیریت اشتراک</p></header>
<main>
  <section class="card" id="loginCard">
    <h2>ورود ادمین</h2>
    <label>رمز ادمین (ADMIN_KEY)</label>
    <input id="key" type="password" dir="ltr" autocomplete="off" placeholder="••••••••••••••••">
    <div class="row" style="margin-top:12px"><button id="loginBtn">ورود</button></div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <div id="app" hidden>
    <div class="row" id="tabs" style="margin-bottom:12px"><button id="tMain">مدیریت</button><button class="ghost" id="tDep">جدول استهلاک</button></div>
    <section data-tab="main" class="card">
      <h2>آمار <button class="ghost" id="refresh" style="float:left;padding:4px 12px;font-size:13px">بروزرسانی</button></h2>
      <div class="grid" id="stats"></div>
      <div class="msg" id="versions"></div>
    </section>

    <section data-tab="main" class="card">
      <h2>ساخت کد فعال‌سازی</h2>
      <label>نوع پلن</label>
      <select id="plan">
        <option value="MONTHLY">ماهانه عادی (۳۰ روز)</option>
        <option value="YEARLY">سالانه عادی (۳۶۵ روز)</option>
        <option value="PREMIUM_MONTHLY">پرمیوم ماهانه (۳۰ روز)</option>
        <option value="PREMIUM_YEARLY">پرمیوم سالانه (۳۶۵ روز)</option>
      </select>
      <div class="row">
        <div><label>تعداد</label><input id="count" type="number" min="1" max="50" value="1" dir="ltr"></div>
        <div><label>مهلت استفاده از کد (روز)</label><input id="validDays" type="number" min="1" max="365" value="30" dir="ltr"></div>
      </div>
      <label>یادداشت (اختیاری، مثلاً نام خریدار)</label>
      <input id="note" maxlength="100">
      <div class="row" style="margin-top:12px"><button id="mk">ساخت کد</button></div>
      <div id="codes"></div>
      <div class="msg" id="mkMsg"></div>
    </section>

    <section data-tab="main" class="card">
      <h2>اعطای مستقیم اشتراک به شماره</h2>
      <label>شماره موبایل (۰۹…)</label>
      <input id="gPhone" dir="ltr" inputmode="numeric" maxlength="11" placeholder="09123456789">
      <label>پلن</label>
      <select id="gPlan">
        <option value="MONTHLY">ماهانه عادی</option><option value="YEARLY">سالانه عادی</option>
        <option value="PREMIUM_MONTHLY">پرمیوم ماهانه</option><option value="PREMIUM_YEARLY">پرمیوم سالانه</option>
      </select>
      <div class="row" style="margin-top:12px"><button id="grant">اعطا</button></div>
      <div class="msg" id="gMsg"></div>
    </section>

    <section data-tab="main" class="card">
      <h2>مسدودسازی و لغو اشتراک</h2>
      <label>شماره موبایل (۰۹…)</label>
      <input id="bPhone" dir="ltr" inputmode="numeric" maxlength="11" placeholder="09123456789">
      <label>دلیل (اختیاری)</label>
      <input id="bReason" maxlength="200">
      <div class="row" style="margin-top:12px">
        <button id="doBan" style="background:var(--bad)">مسدود کن</button>
        <button id="doUnban" class="ghost">آزاد کن</button>
        <button id="doRevoke" class="ghost">لغو اشتراک</button>
      </div>
      <div class="msg" id="bMsg"></div>
    </section>

    <section data-tab="dep" class="card">
      <h2>جدول استهلاک خودروها</h2>
      <p class="hint" id="depInfo">در حال بارگذاری…</p>
      <label>محتوای جدول (JSON: families و data) — می‌توانی فایل dep.json را انتخاب کنی یا مستقیم ویرایش کنی</label>
      <input id="depFile" type="file" accept=".json,application/json">
      <textarea id="depText" dir="ltr" rows="10" style="width:100%;font-family:monospace;font-size:12px"></textarea>
      <div class="row" style="margin-top:12px"><button id="depSave">ذخیره و ارسال به اپ‌ها</button><button class="ghost" id="depReload">بارگذاری مجدد از سرور</button></div>
      <div class="msg" id="depMsg"></div>
    </section>

    <section data-tab="main" class="card">
      <h2>ویدیوی آموزشی فعال‌سازی دسترسی‌ها</h2>
      <label>لینک ویدیو (https://…؛ خالی = دکمه در اپ پیام «هنوز آماده نیست» می‌دهد)</label>
      <input id="tutUrl" dir="ltr" placeholder="https://...">
      <div class="row" style="margin-top:12px"><button id="tutSave">ذخیره لینک</button></div>
      <div class="msg" id="tutMsg"></div>
    </section>

    <section data-tab="main" class="card">
      <h2>کاربران</h2>
      <div class="row"><input id="q" dir="ltr" placeholder="جستجوی شماره یا ایمیل…"><button class="ghost" id="search" style="flex:0 0 auto">جستجو</button></div>
      <div class="scroll"><table id="users"><thead><tr><th>شماره</th><th>روش ورود</th><th>پلن</th><th>انقضا</th><th>آخرین فعالیت</th><th>وضعیت</th></tr></thead><tbody></tbody></table></div>
    </section>
  </div>
</main>
<script>
const API = "https://atzyjiljtzxhctblziti.supabase.co/functions/v1/admin";
const $ = (id) => document.getElementById(id);
let KEY = "";
try { KEY = sessionStorage.getItem("raido_admin") || ""; } catch (e) {}

async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const fa = (n) => Number(n || 0).toLocaleString("fa-IR");
const PLAN_FA = { NONE: "—", TRIAL_7: "تست ۷ روزه", MONTHLY: "ماهانه", YEARLY: "سالانه", PREMIUM_MONTHLY: "پرمیوم ماهانه", PREMIUM_YEARLY: "پرمیوم سالانه" };
const dt = (s) => s ? new Date(s).toLocaleString("fa-IR", { dateStyle: "short", timeStyle: "short" }) : "—";

async function loadStats() {
  const s = await call({ action: "stats" });
  const items = [["کل کاربران", s.users_total], ["جدید امروز", s.new_today], ["فعال ۲۴ساعت", s.active_1d], ["فعال ۷روز", s.active_7d], ["فعال ۳۰روز", s.active_30d],
    ["پرمیوم فعال", s.premium_active], ["اشتراک پولی فعال", s.paid_active], ["تست فعال", s.trial_active], ["تحلیل ۷روز", s.analyses_7d], ["پذیرفته ۷روز", s.accepted_7d], ["کد مصرف‌نشده", s.codes_unused], ["مسدود", s.banned]];
  $("stats").innerHTML = items.map(([l, v]) => `<div class="stat"><b>${fa(v)}</b><span>${l}</span></div>`).join("");
  const v = s.versions || {};
  $("versions").textContent = "نسخه‌ها: " + (Object.keys(v).map((k) => `${k}: ${fa(v[k])}`).join(" · ") || "—");
}
async function loadUsers() {
  const { users } = await call({ action: "users", q: $("q").value });
  $("users").querySelector("tbody").innerHTML = users.map((u) => {
    const sub = Array.isArray(u.subscriptions) ? u.subscriptions[0] : u.subscriptions;
    const exp = sub && sub.expires_at ? new Date(sub.expires_at) : null;
    const active = exp && exp > new Date();
    const via = (u.signup_via === "google" ? "گوگل" : "تلگرام") + (u.last_via && u.last_via !== u.signup_via ? " (اخیر: " + (u.last_via === "google" ? "گوگل" : "تلگرام") + ")" : "");
    return `<tr><td dir="ltr">${u.phone || "—"}${u.phone_verified === false ? " <small class=err>تأییدنشده</small>" : ""}${u.email ? "<br><small dir=ltr>" + u.email + "</small>" : ""}</td><td>${via}</td><td><span class="tag ${sub && sub.is_premium ? "p" : ""}">${PLAN_FA[sub ? sub.plan : "NONE"] || "—"}</span></td><td>${active ? dt(sub.expires_at) : "<span class=err>منقضی/ندارد</span>"}</td><td>${dt(u.last_seen)}</td><td>${u.banned ? "<span class=err>مسدود</span>" : "—"}</td></tr>`;
  }).join("") || `<tr><td colspan="6">کاربری یافت نشد</td></tr>`;
}
function showTab(t) {
  document.querySelectorAll("[data-tab]").forEach((e) => { e.hidden = e.dataset.tab !== t; });
  $("tMain").className = t === "main" ? "" : "ghost"; $("tDep").className = t === "dep" ? "" : "ghost";
}
$("tMain").onclick = () => showTab("main"); $("tDep").onclick = () => showTab("dep");
showTab("main");
async function loadDep() {
  try {
    const r = await call({ action: "get_dep" });
    let txt = r.dep_table || "";
    try { txt = JSON.stringify(JSON.parse(txt), null, 1); } catch (e) {}
    $("depText").value = txt;
    $("depInfo").textContent = r.dep_version ? "نسخهٔ فعلی روی سرور: " + r.dep_version : "هنوز جدولی روی سرور نیست؛ اپ از جدول داخلی خودش استفاده می‌کند.";
  } catch (e) { $("depInfo").textContent = "خطا در بارگذاری: " + e.message; }
}
$("depFile").onchange = async (ev) => { const f = ev.target.files[0]; if (f) $("depText").value = await f.text(); };
$("depReload").onclick = loadDep;
$("depSave").onclick = async () => {
  const m = $("depMsg");
  try {
    JSON.parse($("depText").value);
  } catch (e) { m.className = "msg err"; m.textContent = "JSON معتبر نیست: " + e.message; return; }
  if (!confirm("جدول جدید برای همهٔ کاربران اعمال شود؟")) return;
  try {
    const r = await call({ action: "set_dep", dep_table: $("depText").value });
    m.className = "msg ok"; m.textContent = "ذخیره شد. اپ‌ها در همگام‌سازی بعدی (حداکثر چند ساعت) به‌روز می‌شوند. نسخه: " + r.dep_version;
    loadDep();
  } catch (e) { m.className = "msg err"; m.textContent = "رد شد: " + e.message; }
};
async function loadTut() {
  try { const r = await call({ action: "get_settings" }); $("tutUrl").value = (r.settings && r.settings.tutorial_url) || ""; } catch (e) {}
}
$("tutSave").onclick = async () => {
  try {
    await call({ action: "set_setting", key: "tutorial_url", value: $("tutUrl").value });
    $("tutMsg").className = "msg ok"; $("tutMsg").textContent = "ذخیره شد؛ بدون نیاز به به‌روزرسانی اپ اعمال می‌شود.";
  } catch (e) { $("tutMsg").className = "msg err"; $("tutMsg").textContent = e.message === "bad_url" ? "لینک باید با https:// شروع شود" : "خطا: " + e.message; }
};
async function enter() {
  $("loginCard").hidden = true; $("app").hidden = false;
  await Promise.all([loadStats(), loadUsers(), loadTut(), loadDep()]);
}
$("loginBtn").onclick = async () => {
  KEY = $("key").value.trim(); $("loginMsg").textContent = "";
  try { await call({ action: "stats" }); try { sessionStorage.setItem("raido_admin", KEY); } catch (e) {} await enter(); }
  catch (e) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = e.message === "forbidden" ? "رمز اشتباه است" : e.message === "locked" ? "تلاش زیاد؛ ۱۵ دقیقه بعد دوباره امتحان کن" : "خطا: " + e.message; }
};
$("refresh").onclick = () => Promise.all([loadStats(), loadUsers()]).catch((e) => alert(e.message));
$("search").onclick = () => loadUsers().catch((e) => alert(e.message));
$("mk").onclick = async () => {
  const b = $("mk"); b.disabled = true; $("mkMsg").textContent = ""; $("codes").innerHTML = "";
  try {
    const r = await call({ action: "create_codes", plan: $("plan").value, count: +$("count").value, valid_days: +$("validDays").value, note: $("note").value });
    $("codes").innerHTML = r.codes.map((c) => `<div class="code"><span>${c}</span><button data-c="${c}">کپی</button></div>`).join("");
    $("codes").querySelectorAll("button").forEach((x) => x.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(x.dataset.c); x.textContent = "✓"; });
    $("mkMsg").className = "msg ok"; $("mkMsg").textContent = "کد فقط همین‌جا نمایش داده می‌شود؛ همین حالا کپی کنید.";
    loadStats();
  } catch (e) { $("mkMsg").className = "msg err"; $("mkMsg").textContent = "خطا: " + e.message; }
  b.disabled = false;
};
$("grant").onclick = async () => {
  try {
    await call({ action: "grant", phone: $("gPhone").value.trim(), plan: $("gPlan").value });
    $("gMsg").className = "msg ok"; $("gMsg").textContent = "اشتراک اعمال شد."; loadUsers(); loadStats();
  } catch (e) { $("gMsg").className = "msg err"; $("gMsg").textContent = e.message === "user_not_found" ? "کاربری با این شماره پیدا نشد (باید یک‌بار وارد اپ شده باشد)" : "خطا: " + e.message; }
};
function bMsg(ok, t) { $("bMsg").className = "msg " + (ok ? "ok" : "err"); $("bMsg").textContent = t; }
async function adminAct(action, okText, confirmText) {
  const phone = $("bPhone").value.trim();
  if (!/^09\d{9}$/.test(phone)) return bMsg(false, "شماره معتبر نیست");
  if (confirmText && !confirm(confirmText + "\n" + phone)) return;
  try { await call({ action, phone, reason: $("bReason").value }); bMsg(true, okText); loadUsers(); loadStats(); }
  catch (e) { bMsg(false, e.message === "user_not_found" ? "کاربری با این شماره پیدا نشد" : "خطا: " + e.message); }
}
$("doBan").onclick = () => adminAct("ban", "کاربر مسدود شد و همهٔ نشست‌هایش بسته شد.", "این کاربر مسدود شود؟");
$("doUnban").onclick = () => adminAct("unban", "کاربر آزاد شد (باید دوباره وارد شود).");
$("doRevoke").onclick = () => adminAct("revoke", "اشتراک لغو شد؛ در اولین همگام‌سازی اپ اعمال می‌شود.", "اشتراک این کاربر لغو شود؟");
if (KEY) enter().catch(() => { $("loginCard").hidden = false; $("app").hidden = true; });
</script>
</body>
</html>
